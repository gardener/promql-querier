name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - run: make check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui
      - run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make test

  test-compare:
    name: Test Compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: prometheus-version
        run: echo "version=$(scripts/download-prometheus.sh --print-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: tmp/bin/prometheus
          key: prometheus-${{ runner.os }}-${{ runner.arch }}-${{ steps.prometheus-version.outputs.version }}
      - run: make prometheus
      - run: make test-compare
